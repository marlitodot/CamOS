; CamOS - ESP32-CAM Firmware
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32cam

[env:esp32cam]
platform = espressif32@6.9.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
; 2x 1.9 MB App-Partitionen (OTA-faehig) + kleines SPIFFS
board_build.partitions = min_spiffs.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
; Erzeugt nach dem Build fertige .bin Dateien im Ordner /bin
extra_scripts = post:tools/merge_bin.py
